name: CodeQL

# Static security analysis, kept in its own workflow (the conventional
# split from the build/test pipeline in ci.yml) since it runs on a
# different cadence -- every push/PR plus a weekly scheduled sweep, not
# tied to build success. Worth having on a project that specifically
# claims to handle money movement and PII: this is exactly the kind of
# codebase where "no obvious SQL injection / hardcoded credential /
# insecure deserialization" shouldn't just be an assumption.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Explicit build rather than CodeQL's autobuild: autobuild sometimes
      # guesses wrong on multi-module reactors with an inter-module
      # dependency (every service depends on the common module), so a
      # plain, direct `mvn compile` is more reliable here.
      - name: Build (compile only, no tests needed for analysis)
        run: mvn -B clean compile -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

# Dev-only SMTP catcher, mirroring docker-compose.yml's mailhog service so
# Notification Service has somewhere to actually deliver mail in this
# cluster. A real deployment would point MAIL_HOST/MAIL_PORT (plus auth
# credentials, which MailHog doesn't require) at a real provider — SES,
# SendGrid, a corporate relay — via the Secret, not run a mail server in
# the cluster at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: banking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:latest
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: banking-platform
spec:
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025

# LoadBalancer: the one service meant to be reached from outside the
# cluster. Local clusters (kind/minikube) usually can't provision a
# real external LoadBalancer and will leave EXTERNAL-IP as <pending>
# forever -- that's expected, not broken. Reach it either way with:
#   kubectl -n banking-platform port-forward svc/api-gateway 8080:8080
# A production cluster on a real cloud provider would get a real
# external IP/hostname here, or this Service would be fronted by an
# Ingress + Ingress Controller instead for host/path routing and TLS
# termination -- omitted here as an additional moving part that isn't
# needed to demonstrate the application architecture itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: banking-platform
data:
  CONFIG_SERVER_URI: "http://config-server:8888"
  EUREKA_URI: "http://discovery-server:8761/eureka"
  ZIPKIN_URI: "http://zipkin:9411/api/v2/spans"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: banking-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: banking-platform/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: banking-platform-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banking-platform
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

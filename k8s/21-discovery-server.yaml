# Single replica, deliberately: this Eureka server has
# register-with-eureka/fetch-registry both set to false (it's a
# server, not also a peer client), so a second replica would run as an
# entirely separate, un-synchronized registry rather than an HA pair —
# clients would randomly see whichever pod's Service routed them to
# it. A real Eureka HA cluster needs each node's defaultZone to list
# every peer, which is a deliberate scope boundary here, the same way
# the Kafka manifest documents staying single-broker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-server-config
  namespace: banking-platform
data:
  EUREKA_HOSTNAME: "discovery-server"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: banking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: banking-platform/discovery-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: discovery-server-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: banking-platform
spec:
  type: ClusterIP
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761

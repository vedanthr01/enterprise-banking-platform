# Placeholder development secrets, committed only so `kubectl apply -f k8s/`
# works out of the box for local clusters (kind/minikube) with zero setup.
# stringData is used instead of data specifically so these are readable
# here as plain text — Kubernetes base64-encodes them itself on apply; that
# encoding is NOT encryption and must never be treated as one.
#
# This is not how a real deployment should handle secrets: base64 in a
# YAML file checked into source control is trivially reversible by anyone
# with repo access. A production cluster would source these from a real
# secrets manager instead — e.g. External Secrets Operator pulling from AWS
# Secrets Manager / GCP Secret Manager / HashiCorp Vault, or Sealed Secrets
# for a GitOps-friendly encrypted-at-rest alternative — and CI/CD would
# never have the plaintext values in a file at all. Noted here rather than
# implemented, since none of those require any Kubernetes-specific
# infrastructure this project doesn't already need to demonstrate the
# actual application architecture.
apiVersion: v1
kind: Secret
metadata:
  name: banking-platform-secrets
  namespace: banking-platform
type: Opaque
stringData:
  JWT_SECRET: "change-this-super-secret-banking-platform-signing-key-min-256-bits"
  INTERNAL_API_KEY: "change-this-internal-service-key"
  DB_USERNAME: "banking_app"
  DB_PASSWORD: "banking_app_pw"
  MYSQL_ROOT_PASSWORD: "rootpw"

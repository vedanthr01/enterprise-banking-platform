apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-service-config
  namespace: banking-platform
data:
  CONFIG_SERVER_URI: "http://config-server:8888"
  EUREKA_URI: "http://discovery-server:8761/eureka"
  ZIPKIN_URI: "http://zipkin:9411/api/v2/spans"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "transaction_db"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: banking-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -w2 mysql 3306; do echo waiting for mysql; sleep 3; done;']
      containers:
        - name: transaction-service
          image: banking-platform/transaction-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: transaction-service-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: banking-platform-secrets
                  key: JWT_SECRET
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-platform-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-platform-secrets
                  key: DB_PASSWORD
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: banking-platform-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: banking-platform
spec:
  type: ClusterIP
  selector:
    app: transaction-service
  ports:
    - port: 8084
      targetPort: 8084
---
# One HPA shown as a representative example rather than repeated on all 11
# Deployments -- Transaction Service is the highest-traffic, most
# CPU-sensitive service (Saga orchestration, outbox polling) and the most
# realistic autoscaling candidate. The same pattern (scaleTargetRef ->
# Deployment, CPU-utilization target) applies identically to any other
# service; duplicating it 11 times would demonstrate the same one idea 11
# times over.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service
  namespace: banking-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
